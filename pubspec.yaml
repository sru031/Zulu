name: zulu
description: "Zulu, a gentle self-care pet."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  lottie: ^3.6.1
  material_ui: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  image: ^4.10.1

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/theme/
    - assets/theme/icons/
    - assets/theme/pet/
    - assets/theme/pet/eggs/
    - assets/theme/pet/baby/
    - assets/theme/pet/toddler/
    - assets/theme/pet/teen/
    - assets/theme/pet/adult/
    - assets/theme/items/
    - assets/theme/rooms/
    - assets/theme/rooms/home/
    - assets/theme/effects/
